<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>4K WALLPAPERS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Francois+One&family=Rubik+Vinyl&display=swap" rel="stylesheet">

  <style>
    /* --- Phi / Fibonacci Natural Scale --- */
    :root {
      --phi: 1.6180339887;
      --fib-1: 1px;
      --fib-2: 2px;
      --fib-3: 3px;
      --fib-5: 5px;
      --fib-8: 8px;
      --fib-13: 13px;
      --fib-21: 21px;
      --fib-34: 34px;
      --fib-55: 55px;
      --fib-89: 89px;
      --fib-144: 144px;
      --fib-233: 233px;
      --fib-377: 377px;
      --fib-610: 610px;
      --fib-987: 987px;

      --nav-btn-size: var(--fib-55); /* 55px */
      --nav-pad: var(--fib-8);        /* 8px */
      --nav-dock-height: calc(var(--nav-btn-size) + (var(--nav-pad) * 2) + 2px);
      --info-dock-gap: var(--fib-13);

      --glass-bg: rgba(18, 18, 22, 0.76);
      --glass-border: rgba(255, 255, 255, 0.13);
      --glass-highlight: rgba(255, 255, 255, 0.34);
      --glass-shadow: 0 var(--fib-8) var(--fib-34) rgba(0, 0, 0, 0.65);
      --accent-yellow: #ffe066;
      --font-body: 'Francois One', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-splash: 'Rubik Vinyl', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* High-Contrast Golden-Yellow Selection */
    ::selection {
      background: var(--accent-yellow) !important;
      color: #0c0d10 !important;
    }
    ::-moz-selection {
      background: var(--accent-yellow) !important;
      color: #0c0d10 !important;
    }

    body {
      background-color: #0c0d10;
      color: #f5f5f7;
      font-family: var(--font-body);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #texture-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    /* Viewport Vignette: Edge Depth Falloff */
    #vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      background: linear-gradient(
        to bottom,
        rgba(12, 13, 16, 0.88) 0%,
        rgba(12, 13, 16, 0.42) 13%,
        rgba(12, 13, 16, 0) 28%,
        rgba(12, 13, 16, 0) 72%,
        rgba(12, 13, 16, 0.48) 87%,
        rgba(12, 13, 16, 0.92) 100%
      );
    }

    /* Centered Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 14, 0.92);
      backdrop-filter: blur(var(--fib-21));
      -webkit-backdrop-filter: blur(var(--fib-21));
      z-index: 1000;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #splash-screen.dismissed {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--fib-21) var(--fib-34);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--fib-21);
      box-shadow: var(--glass-shadow);
      text-align: center;
    }

    .splash-title {
      font-family: var(--font-splash);
      font-size: clamp(2.3rem, 7.5vw, 5rem);
      letter-spacing: var(--fib-5);
      color: #ffffff;
      text-shadow: 0 0 var(--fib-34) rgba(255, 255, 255, 0.25);
      line-height: 1.1;
    }

    .splash-4k {
      color: var(--accent-yellow);
      text-shadow: 0 0 var(--fib-21) rgba(255, 224, 102, 0.45);
    }

    .splash-sub {
      font-family: var(--font-body);
      font-size: clamp(0.85rem, 2.2vw, 1.25rem);
      letter-spacing: var(--fib-2);
      color: rgba(235, 235, 245, 0.8);
      margin-top: var(--fib-8);
      text-transform: uppercase;
    }

    /* Gallery Feed */
    #gallery-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--fib-987);
      padding: var(--fib-34) var(--fib-13) calc(var(--fib-144) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: var(--fib-55);
    }

    .image-slot {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--fib-13);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 var(--fib-13) var(--fib-34) rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      touch-action: pan-y;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      transition: border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      visibility: hidden;
      color: transparent;
      font-size: 0;
      pointer-events: none;
      transition: opacity 0.34s ease-in-out, filter 0.28s ease;
    }

    .image-slot img.loaded {
      opacity: 1;
      visibility: visible;
    }

    /* Armed Card */
    .image-slot.armed {
      border-color: var(--glass-highlight);
      box-shadow: inset 0 0 0 2px var(--glass-highlight), 0 var(--fib-21) var(--fib-55) rgba(0, 0, 0, 0.85);
    }

    .image-slot.armed img {
      filter: brightness(0.60) !important;
    }

    /* Armed Overlay Container */
    .slot-action-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.21s cubic-bezier(0.16, 1, 0.3, 1), transform 0.21s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(0.92);
      z-index: 10;
      padding: var(--fib-13);
    }

    .image-slot.armed .slot-action-overlay {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    /* Action Modal Card */
    .slot-action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--fib-13);
      max-width: 100%;
    }

    .action-btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--fib-13);
    }

    .btn-slot-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--fib-8);
      background: var(--glass-bg);
      border: 1px solid var(--glass-highlight);
      border-radius: var(--fib-21);
      padding: var(--fib-13) var(--fib-21);
      min-width: var(--fib-89);
      backdrop-filter: blur(var(--fib-21));
      -webkit-backdrop-filter: blur(var(--fib-21));
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      pointer-events: none;
      transition: transform 0.13s ease, background 0.13s ease;
    }

    .btn-slot-action:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.22);
    }

    .btn-slot-action .action-emoji {
      font-size: 2rem;
      line-height: 1;
      display: block;
    }

    .btn-slot-action .action-label {
      font-family: var(--font-body);
      font-size: 0.85rem;
      letter-spacing: var(--fib-2);
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
      text-box-trim: both;
      text-box-edge: cap alphabetic;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* In-Card Info Field */
    .slot-info-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--fib-21));
      -webkit-backdrop-filter: blur(var(--fib-21));
      border-radius: var(--fib-13);
      box-shadow: var(--glass-shadow);
      padding: var(--fib-8) var(--fib-13);
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      color: #e5e5ea;
      max-width: min(calc(100vw - var(--fib-55)), var(--fib-610));
      word-break: break-all;
      user-select: text;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      transition: border-color 0.21s ease;
    }

    .slot-info-box:hover {
      border-color: var(--glass-highlight);
    }

    /* Search Drawer */
    .glass-pill {
      position: fixed;
      bottom: calc(var(--fib-21) + var(--nav-dock-height) + var(--info-dock-gap) + env(safe-area-inset-bottom));
      z-index: 900;
      max-width: min(calc(100vw - var(--fib-34)), var(--fib-610));
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--fib-21));
      -webkit-backdrop-filter: blur(var(--fib-21));
      border-radius: var(--fib-13);
      box-shadow: var(--glass-shadow);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: #e5e5ea;
      transition: opacity 0.21s ease, transform 0.21s ease, left 0.34s cubic-bezier(0.16, 1, 0.3, 1), right 0.34s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(var(--fib-8));
      pointer-events: none;
    }

    .glass-pill.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #search-box {
      display: flex;
      align-items: center;
      padding: var(--fib-5) var(--fib-8);
      gap: var(--fib-8);
      width: min(360px, calc(100vw - var(--fib-55)));
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 0.95rem;
      user-select: text;
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
    }

    #btn-search-clear {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
      cursor: pointer;
      padding: 0 var(--fib-5);
    }

    /* Fixed Navigation Dock */
    #nav-dock {
      position: fixed;
      bottom: calc(var(--fib-21) + env(safe-area-inset-bottom));
      z-index: 950;
      display: flex;
      align-items: center;
      gap: var(--fib-8);
      padding: var(--nav-pad);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--fib-21);
      backdrop-filter: blur(var(--fib-34)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--fib-34)) saturate(180%);
      box-shadow: var(--glass-shadow);
      touch-action: pan-y;
      cursor: grab;
      transition: left 0.34s cubic-bezier(0.16, 1, 0.3, 1), right 0.34s cubic-bezier(0.16, 1, 0.3, 1), width 0.34s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #nav-dock:active {
      cursor: grabbing;
    }

    /* Dock Alignment */
    body.hand-right #nav-dock,
    body.hand-right .glass-pill {
      right: var(--fib-21);
      left: auto;
    }

    body.hand-left #nav-dock,
    body.hand-left .glass-pill {
      left: var(--fib-21);
      right: auto;
    }

    /* Desktop Horizontal Ordering (6 buttons) */
    /* Right-Docked: [ 👈🏼 ] [ 🔍 ] [ 🎲 ] [ ☑️ ] [ ⬅️ ] [ ➡️ ] */
    body.hand-right #btn-hand   { order: 1; }
    body.hand-right #btn-search { order: 2; }
    body.hand-right #btn-random { order: 3; }
    body.hand-right #btn-action { order: 4; }
    body.hand-right #btn-prev   { order: 5; }
    body.hand-right #btn-next   { order: 6; }

    /* Left-Docked: [ ⬅️ ] [ ➡️ ] [ ☑️ ] [ 🎲 ] [ 🔎 ] [ 👉🏼 ] */
    body.hand-left #btn-prev   { order: 1; }
    body.hand-left #btn-next   { order: 2; }
    body.hand-left #btn-action { order: 3; }
    body.hand-left #btn-random { order: 4; }
    body.hand-left #btn-search { order: 5; }
    body.hand-left #btn-hand   { order: 6; }

    .nav-btn {
      width: var(--nav-btn-size);
      height: var(--nav-btn-size);
      min-width: var(--nav-btn-size);
      border-radius: var(--fib-13);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      cursor: pointer;
      transition: transform 0.13s ease, background 0.13s ease, border-color 0.13s ease;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--glass-highlight);
    }

    .dice-icon {
      display: inline-block;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #toast {
      position: fixed;
      top: var(--fib-34);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: var(--fib-8) var(--fib-21);
      border-radius: var(--fib-21);
      backdrop-filter: blur(var(--fib-21));
      -webkit-backdrop-filter: blur(var(--fib-21));
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.21s ease, transform 0.21s ease;
      z-index: 1100;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- Responsive Mobile Viewports (<= 540px, 3x2 Grid) --- */
    @media (max-width: 540px) {
      :root {
        --nav-dock-height: calc((var(--nav-btn-size) * 2) + var(--fib-8) + (var(--nav-pad) * 2) + 2px);
      }

      #nav-dock {
        display: grid;
        grid-template-rows: repeat(2, var(--nav-btn-size));
        grid-template-columns: repeat(3, var(--nav-btn-size));
        gap: var(--fib-8);
        overflow: hidden;
      }

      /* Right-Docked Grid:
         Row 1: [ 🔍 ] [ 🎲 ] [ 👉🏼 ]
         Row 2: [ ⬅️ ] [ ➡️ ] [ ☑️ ] */
      body.hand-right #nav-dock {
        justify-content: end;
      }
      body.hand-right #btn-search { grid-column: 1; grid-row: 1; }
      body.hand-right #btn-random { grid-column: 2; grid-row: 1; }
      body.hand-right #btn-hand   { grid-column: 3; grid-row: 1; }

      body.hand-right #btn-prev   { grid-column: 1; grid-row: 2; }
      body.hand-right #btn-next   { grid-column: 2; grid-row: 2; }
      body.hand-right #btn-action { grid-column: 3; grid-row: 2; }

      /* Left-Docked Grid:
         Row 1: [ 👈🏼 ] [ 🎲 ] [ 🔎 ]
         Row 2: [ ☑️ ] [ ⬅️ ] [ ➡️ ] */
      body.hand-left #nav-dock {
        justify-content: start;
      }
      body.hand-left #btn-hand   { grid-column: 1; grid-row: 1; }
      body.hand-left #btn-random { grid-column: 2; grid-row: 1; }
      body.hand-left #btn-search { grid-column: 3; grid-row: 1; }

      body.hand-left #btn-action { grid-column: 1; grid-row: 2; }
      body.hand-left #btn-prev   { grid-column: 2; grid-row: 2; }
      body.hand-left #btn-next   { grid-column: 3; grid-row: 2; }

      /* Mobile XS Collapsed: Exactly 1 column width */
      body.dock-collapsed #nav-dock {
        width: calc(var(--nav-btn-size) + (var(--nav-pad) * 2) + 2px);
      }
      body:not(.dock-collapsed) #nav-dock {
        width: calc((var(--nav-btn-size) * 3) + (var(--fib-8) * 2) + (var(--nav-pad) * 2) + 2px);
      }
    }
  </style>
</head>
<body class="hand-right dock-collapsed">

  <canvas id="texture-canvas"></canvas>
  <div id="vignette-overlay"></div>

  <div id="splash-screen">
    <div class="splash-box">
      <div class="splash-title"><span class="splash-4k">4K</span> WALLPAPERS</div>
      <div class="splash-sub" id="splash-count">CURRENT TOTAL: ...</div>
    </div>
  </div>

  <div id="toast">Notification</div>

  <div id="search-box" class="glass-pill">
    <input type="text" id="search-input" placeholder="Filter by name or go directly; e.g. #33" autocomplete="off" spellcheck="false">
    <button id="btn-search-clear" aria-label="Clear & Close Search">✕</button>
  </div>

  <main id="gallery-container"></main>

  <nav id="nav-dock">
    <button class="nav-btn" id="btn-hand" aria-label="Toggle Navigation Tray">👈🏼</button>
    <button class="nav-btn" id="btn-search" aria-label="Search Collection">🔍</button>
    <button class="nav-btn" id="btn-random" aria-label="Random Wallpaper"><span class="dice-icon" id="dice">🎲</span></button>
    <button class="nav-btn" id="btn-action" aria-label="Open Wallpaper Menu">☑️</button>
    <button class="nav-btn" id="btn-prev" aria-label="Previous Wallpaper">⬅️</button>
    <button class="nav-btn" id="btn-next" aria-label="Next Wallpaper">➡️</button>
  </nav>

  <script>
    const GITHUB_REPO = 'cgio/tv-assets';
    const GITHUB_BRANCH = 'main';
    const MANIFEST_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/wallpapers/roseberys/wallpapers.json`;
    const RAW_IMG_BASE = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/wallpapers/roseberys/`;

    let wallpapers = [];
    let visibleIndices = [];
    let currentIndex = 0;
    let isLeftHanded = false;
    let isCollapsed = true;
    let searchVisible = false;
    let diceDegrees = 0;
    let armedIndex = null;
    let armLockTimer = null;
    let currentActiveWindow = new Set();
    const SLOTS = [];

    (function initOrganicTexture() {
      const canvas = document.getElementById('texture-canvas');
      const ctx = canvas.getContext('2d');
      const size = 128;
      canvas.width = size;
      canvas.height = size;

      const imgData = ctx.createImageData(size, size);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const val = Math.floor(Math.random() * 25) + 8;
        imgData.data[i] = val;
        imgData.data[i + 1] = val + 2;
        imgData.data[i + 2] = val + 5;
        imgData.data[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      canvas.style.backgroundImage = `url(${canvas.toDataURL()})`;
      canvas.style.backgroundRepeat = 'repeat';
      canvas.style.backgroundSize = '128px 128px';
    })();

    const diceEl = document.getElementById('dice');
    diceDegrees = Math.floor(Math.random() * 10) * 36;
    diceEl.style.transform = `rotate(${diceDegrees}deg)`;

    function stepDiceRotation() {
      diceDegrees += 360 + (36 * 3);
      diceEl.style.transform = `rotate(${diceDegrees}deg)`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1618);
    }

    // Direct Download & iOS Native Sheet Interception
    async function triggerDownload(index) {
      const filename = wallpapers[index];
      if (!filename) return;
      showToast('Preparing 4K image...');
      const rawUrl = RAW_IMG_BASE + encodeURIComponent(filename);
      try {
        const res = await fetch(rawUrl);
        const blob = await res.blob();
        const file = new File([blob], filename, { type: 'image/webp' });

        // iOS Safari / Web Share API with Files: Native Photos Camera Roll & Wallpaper setter
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: filename
          });
          showToast('Image Ready');
          return;
        }

        // Standard Blob Download (Android, Desktop Chrome/Firefox)
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        showToast('Downloading...');
      } catch (err) {
        if (err.name === 'AbortError') return; // User closed iOS share sheet cleanly
        const a = document.createElement('a');
        a.href = rawUrl;
        a.download = filename;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Downloading...');
      }
    }

    // Web Share API + Clipboard Fallback for ?i=X links
    async function triggerShare(index) {
      const shareUrl = `${window.location.origin}${window.location.pathname}?i=${index + 1}`;
      const shareData = {
        title: `4K Wallpaper #${(index + 1).toLocaleString()}`,
        text: `4K Wallpaper #${(index + 1).toLocaleString()}`,
        url: shareUrl
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          showToast('Shared');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('Share Link Copied');
      }).catch(() => {
        showToast('Clipboard access denied');
      });
    }

    function disarmAllSlots() {
      if (armLockTimer) {
        clearTimeout(armLockTimer);
        armLockTimer = null;
      }
      document.querySelectorAll('.image-slot.armed').forEach(slot => {
        slot.classList.remove('armed');
        slot.dataset.armedAt = '0';
        slot.querySelectorAll('.btn-slot-action').forEach(btn => btn.style.pointerEvents = 'none');
      });
      armedIndex = null;
    }

    function armSlot(index) {
      disarmAllSlots();
      const slot = SLOTS[index];
      if (slot) {
        slot.classList.add('armed');
        armedIndex = index;
        const now = Date.now();
        slot.dataset.armedAt = String(now);
        const actionBtns = slot.querySelectorAll('.btn-slot-action');
        actionBtns.forEach(btn => btn.style.pointerEvents = 'none');

        armLockTimer = setTimeout(() => {
          if (armedIndex === index && slot.classList.contains('armed') && slot.dataset.armedAt === String(now)) {
            actionBtns.forEach(btn => btn.style.pointerEvents = 'auto');
          }
        }, 450);
      }
    }

    // High-Performance Differential Active Window (Eliminates 1,494 DOM traversals)
    function updateActiveMemoryBudget(visiblePos) {
      if (visibleIndices.length === 0) return;
      currentIndex = visibleIndices[visiblePos];

      const lower = Math.max(0, visiblePos - 3);
      const upper = Math.min(visibleIndices.length - 1, visiblePos + 3);
      const nextActiveWindow = new Set(visibleIndices.slice(lower, upper + 1));

      // Deactivate only slots leaving active range
      currentActiveWindow.forEach(idx => {
        if (!nextActiveWindow.has(idx) && SLOTS[idx]) {
          const img = SLOTS[idx]._img;
          if (img && img.src) {
            img.classList.remove('loaded');
            img.removeAttribute('src');
          }
        }
      });

      // Activate only newly visible slots
      nextActiveWindow.forEach(idx => {
        if (!currentActiveWindow.has(idx) && SLOTS[idx]) {
          const img = SLOTS[idx]._img;
          if (img && (!img.src || img.src === window.location.href)) {
            img.src = RAW_IMG_BASE + encodeURIComponent(wallpapers[idx]);
            img.onload = () => img.classList.add('loaded');
          }
        }
      });

      currentActiveWindow = nextActiveWindow;
    }

    // Zero-Jank Center Midpoint Observer (Replaces all JS scroll event thrashing)
    const centerObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.target.style.display !== 'none') {
          const slotIdx = parseInt(entry.target.dataset.index, 10);
          const vPos = visibleIndices.indexOf(slotIdx);
          if (vPos !== -1) {
            updateActiveMemoryBudget(vPos);
          }
        }
      });
    }, { rootMargin: '-49% 0px -49% 0px' });

    async function loadWallpapers() {
      try {
        const res = await fetch(MANIFEST_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        wallpapers = await res.json();
      } catch (err) {
        showToast('Using local manifest fallback');
        const localRes = await fetch('roseberys/wallpapers.json');
        wallpapers = await localRes.json();
      }

      if (!wallpapers || !wallpapers.length) {
        showToast('No wallpapers located.');
        document.getElementById('splash-count').textContent = 'CURRENT TOTAL: 0';
        return;
      }

      document.getElementById('splash-count').textContent = `CURRENT TOTAL: ${wallpapers.length.toLocaleString()}`;

      const container = document.getElementById('gallery-container');
      container.innerHTML = '';
      visibleIndices = [];

      wallpapers.forEach((file, index) => {
        const slot = document.createElement('div');
        slot.className = 'image-slot';
        slot.dataset.index = index;
        slot.dataset.armedAt = '0';

        const img = document.createElement('img');
        img.alt = file;
        img.loading = 'eager';
        img.decoding = 'async'; // Offload 4K WebP bitmap decoding from main thread
        slot._img = img;        // Direct cache prevents runtime DOM querying

        const overlay = document.createElement('div');
        overlay.className = 'slot-action-overlay';

        const actionCard = document.createElement('div');
        actionCard.className = 'slot-action-card';

        const btnRow = document.createElement('div');
        btnRow.className = 'action-btn-row';

        const dlBtn = document.createElement('button');
        dlBtn.className = 'btn-slot-action btn-slot-download';
        dlBtn.setAttribute('aria-label', 'Download Wallpaper');
        dlBtn.innerHTML = '<span class="action-emoji">💾</span><span class="action-label">SAVE</span>';

        dlBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const armedAt = parseInt(slot.dataset.armedAt || '0', 10);
          if (Date.now() - armedAt < 450) {
            e.preventDefault();
            return;
          }
          triggerDownload(index);
          disarmAllSlots();
        });

        const shareBtn = document.createElement('button');
        shareBtn.className = 'btn-slot-action btn-slot-share';
        shareBtn.setAttribute('aria-label', 'Share Wallpaper Link');
        shareBtn.innerHTML = '<span class="action-emoji">🔗</span><span class="action-label">SHARE</span>';

        shareBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const armedAt = parseInt(slot.dataset.armedAt || '0', 10);
          if (Date.now() - armedAt < 450) {
            e.preventDefault();
            return;
          }
          triggerShare(index);
          disarmAllSlots();
        });

        btnRow.appendChild(dlBtn);
        btnRow.appendChild(shareBtn);

        const infoBox = document.createElement('div');
        infoBox.className = 'slot-info-box';
        infoBox.title = 'Click to highlight text';
        infoBox.textContent = `#${(index + 1).toLocaleString()} | ${file}`;

        infoBox.addEventListener('click', (e) => {
          e.stopPropagation();
          const sel = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(infoBox);
          sel.removeAllRanges();
          sel.addRange(range);
          showToast('Text Highlighted');
        });

        actionCard.appendChild(btnRow);
        actionCard.appendChild(infoBox);
        overlay.appendChild(actionCard);

        slot.appendChild(img);
        slot.appendChild(overlay);

        let startX = 0;
        let startY = 0;
        let isSlotDrag = false;

        slot.addEventListener('pointerdown', (e) => {
          startX = e.clientX;
          startY = e.clientY;
          isSlotDrag = false;
        });

        slot.addEventListener('pointermove', (e) => {
          if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
            isSlotDrag = true;
          }
        });

        slot.addEventListener('click', () => {
          if (isSlotDrag) return;
          if (armedIndex === index) {
            disarmAllSlots();
          } else {
            armSlot(index);
          }
        });

        container.appendChild(slot);
        SLOTS.push(slot);
        visibleIndices.push(index);
        centerObserver.observe(slot);
      });

      // Direct Query Index Parameter (?i=56)
      const urlParams = new URLSearchParams(window.location.search);
      const paramI = urlParams.get('i');
      let initialPos;

      if (paramI) {
        const parsedNum = parseInt(paramI.replace(/,/g, ''), 10);
        if (!isNaN(parsedNum) && parsedNum >= 1 && parsedNum <= wallpapers.length) {
          initialPos = parsedNum - 1;
        }
      }

      if (initialPos === undefined) {
        const randomStart = Math.floor(Math.random() * (wallpapers.length - 8)) + 4;
        initialPos = Math.max(0, Math.min(randomStart, wallpapers.length - 1));
      }

      SLOTS[initialPos].scrollIntoView({ block: 'center' });
      updateActiveMemoryBudget(initialPos);
      updateControlsOrientation();

      if (document.fonts) {
        await document.fonts.ready;
      }

      setTimeout(() => {
        document.getElementById('splash-screen').classList.add('dismissed');
        showToast(`Wallpaper #${(initialPos + 1).toLocaleString()}`);
      }, 750);
    }

    window.addEventListener('scroll', () => disarmAllSlots(), { passive: true });
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.image-slot')) disarmAllSlots();
    });

    function scrollToVisiblePosition(vPos) {
      if (visibleIndices.length === 0) return;
      if (vPos < 0) vPos = visibleIndices.length - 1;
      else if (vPos >= visibleIndices.length) vPos = 0;

      disarmAllSlots();
      const targetIdx = visibleIndices[vPos];
      updateActiveMemoryBudget(vPos);
      const targetSlot = SLOTS[targetIdx];
      targetSlot.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      const curVPos = visibleIndices.indexOf(currentIndex);
      scrollToVisiblePosition(curVPos - 1);
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      const curVPos = visibleIndices.indexOf(currentIndex);
      scrollToVisiblePosition(curVPos + 1);
    });

    document.getElementById('btn-random').addEventListener('click', () => {
      if (visibleIndices.length <= 1) return;
      stepDiceRotation();
      let nextVPos;
      const curVPos = visibleIndices.indexOf(currentIndex);
      do {
        nextVPos = Math.floor(Math.random() * visibleIndices.length);
      } while (nextVPos === curVPos);

      scrollToVisiblePosition(nextVPos);
      showToast(`Wallpaper #${(visibleIndices[nextVPos] + 1).toLocaleString()}`);
    });

    // Active Card Action Trigger Button (☑️)
    document.getElementById('btn-action').addEventListener('click', () => {
      if (armedIndex === currentIndex) {
        disarmAllSlots();
      } else {
        armSlot(currentIndex);
        const targetSlot = SLOTS[currentIndex];
        if (targetSlot) {
          targetSlot.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    function updateControlsOrientation() {
      const btnHand = document.getElementById('btn-hand');
      const btnSearch = document.getElementById('btn-search');

      btnSearch.textContent = isLeftHanded ? '🔎' : '🔍';

      if (window.innerWidth <= 540) {
        if (isLeftHanded) {
          btnHand.textContent = isCollapsed ? '👉🏼' : '👈🏼';
        } else {
          btnHand.textContent = isCollapsed ? '👈🏼' : '👉🏼';
        }
      } else {
        btnHand.textContent = isLeftHanded ? '👉🏼' : '👈🏼';
      }
    }

    function setHandMode(left) {
      isLeftHanded = left;
      document.body.className = (isLeftHanded ? 'hand-left' : 'hand-right') + (isCollapsed ? ' dock-collapsed' : '');
      updateControlsOrientation();
      showToast(isLeftHanded ? 'Left-handed Mode' : 'Right-handed Mode');
    }

    document.getElementById('btn-hand').addEventListener('click', () => {
      if (window.innerWidth <= 540) {
        isCollapsed = !isCollapsed;
        document.body.classList.toggle('dock-collapsed', isCollapsed);
        updateControlsOrientation();
      } else {
        setHandMode(!isLeftHanded);
      }
    });

    window.addEventListener('resize', updateControlsOrientation);

    // Non-capturing Desktop Drag Detection
    const navDock = document.getElementById('nav-dock');
    let isMouseDown = false;
    let dockStartX = 0;
    let dockStartY = 0;
    let hasDragged = false;

    navDock.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      isMouseDown = true;
      dockStartX = e.clientX;
      dockStartY = e.clientY;
      hasDragged = false;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isMouseDown) return;
      if (Math.hypot(e.clientX - dockStartX, e.clientY - dockStartY) > 18) {
        hasDragged = true;
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      if (hasDragged) {
        const dx = e.clientX - dockStartX;
        if (!isLeftHanded && dx < -60) {
          setHandMode(true);
        } else if (isLeftHanded && dx > 60) {
          setHandMode(false);
        }
      }
    });

    navDock.addEventListener('click', (e) => {
      if (hasDragged) {
        e.stopPropagation();
        e.preventDefault();
        hasDragged = false;
      }
    }, true);

    const searchBox = document.getElementById('search-box');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('btn-search');

    function toggleSearch(show) {
      searchVisible = show !== undefined ? show : !searchVisible;
      searchBox.classList.toggle('visible', searchVisible);
      if (searchVisible) searchInput.focus();
      else searchInput.blur();
    }

    searchBtn.addEventListener('click', () => toggleSearch());

    function executeDirectJump(num) {
      if (num >= 1 && num <= wallpapers.length) {
        const targetIdx = num - 1;
        visibleIndices = wallpapers.map((_, i) => i);
        wallpapers.forEach((_, idx) => {
          SLOTS[idx].style.display = 'flex';
        });
        updateActiveMemoryBudget(targetIdx);
        SLOTS[targetIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        showToast(`Wallpaper #${num.toLocaleString()}`);
        toggleSearch(false);
      } else {
        showToast(`Out of range (1–${wallpapers.length.toLocaleString()})`);
      }
    }

    function applySearchFilter(query) {
      disarmAllSlots();
      const trimmed = query.trim();
      if (trimmed.startsWith('#')) return;

      const q = trimmed.toLowerCase();
      visibleIndices = [];

      wallpapers.forEach((fname, idx) => {
        const matches = !q || fname.toLowerCase().includes(q);
        SLOTS[idx].style.display = matches ? 'flex' : 'none';
        if (matches) visibleIndices.push(idx);
      });

      if (visibleIndices.length > 0) {
        if (!visibleIndices.includes(currentIndex)) {
          scrollToVisiblePosition(0);
        } else {
          updateActiveMemoryBudget(visibleIndices.indexOf(currentIndex));
        }
        if (q) showToast(`${visibleIndices.length.toLocaleString()} Matches`);
      } else {
        showToast('No Matches Found');
      }
    }

    searchInput.addEventListener('input', (e) => applySearchFilter(e.target.value));

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const trimmed = searchInput.value.trim();
        const directMatch = trimmed.match(/^#?(\d[\d,]*)$/);
        if (directMatch) {
          const num = parseInt(directMatch[1].replace(/,/g, ''), 10);
          executeDirectJump(num);
          return;
        }
        toggleSearch(false);
      }
    });

    document.getElementById('btn-search-clear').addEventListener('click', () => {
      searchInput.value = '';
      applySearchFilter('');
      toggleSearch(false);
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput) {
        if (e.key === 'Escape') toggleSearch(false);
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'j') {
        const curVPos = visibleIndices.indexOf(currentIndex);
        scrollToVisiblePosition(curVPos + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'k') {
        const curVPos = visibleIndices.indexOf(currentIndex);
        scrollToVisiblePosition(curVPos - 1);
      } else if (e.key === 'r') {
        document.getElementById('btn-random').click();
      } else if (e.key === 'e' || e.key === ' ') {
        e.preventDefault();
        document.getElementById('btn-action').click();
      } else if (e.key === '/' || e.key === 'f') {
        e.preventDefault();
        toggleSearch(true);
      } else if (e.key === 'Escape') {
        if (searchVisible) toggleSearch(false);
        disarmAllSlots();
      }
    });

    window.addEventListener('DOMContentLoaded', loadWallpapers);
  </script>
